<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dökümanlar — Alperen Erkan</title>
<meta name="description" content="QuantumOS ve NeOx Ekosistemi — açık kaynak proje dökümanları.">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⌘</text></svg>">
<style>
/* ---------- /docs özel stiller ---------- */
.docs-head{padding:140px 0 20px}
.docs-head h1{font-size:clamp(38px,6vw,62px);font-weight:700;letter-spacing:-.03em}
.docs-head .lede{margin-top:16px;max-width:620px}

.proj-switch{display:flex;gap:12px;margin-top:36px;flex-wrap:wrap}
.proj-tab{
  border:1px solid var(--line);background:var(--bg-soft);border-radius:16px;
  padding:16px 22px;cursor:pointer;text-align:left;font-family:inherit;
  transition:all .3s var(--ease);min-width:200px;
}
.proj-tab .t-name{font-size:17px;font-weight:700;letter-spacing:-.01em}
.proj-tab .t-tag{font-size:12px;color:var(--ink-3);margin-top:3px;font-weight:500}
.proj-tab:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(0,0,0,.07)}
.proj-tab.active{background:var(--ink);border-color:var(--ink)}
.proj-tab.active .t-name{color:#fff}
.proj-tab.active .t-tag{color:rgba(255,255,255,.6)}

.docs-layout{
  display:grid;grid-template-columns:260px 1fr;gap:44px;
  margin-top:44px;padding-bottom:100px;align-items:start;
}
@media(max-width:860px){.docs-layout{grid-template-columns:1fr}}

.docs-side{position:sticky;top:96px}
@media(max-width:860px){.docs-side{position:static}}
.docs-side .s-title{
  font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-3);margin-bottom:14px;
}
.docs-side .s-desc{font-size:13.5px;color:var(--ink-2);line-height:1.6;margin-bottom:22px}
.doc-link{
  display:block;padding:11px 14px;border-radius:12px;font-size:14.5px;font-weight:500;
  color:var(--ink-2);transition:background .2s,color .2s;margin-bottom:2px;
}
.doc-link:hover{background:rgba(0,0,0,.045);color:var(--ink)}
.doc-link.active{background:var(--ink);color:#fff}
.doc-link .n{
  display:inline-block;width:22px;font-size:11.5px;font-weight:700;color:var(--accent);
}
.doc-link.active .n{color:rgba(255,255,255,.65)}

.doc-view{min-width:0}
.doc-view .doc-title{
  font-size:clamp(26px,3.6vw,38px);font-weight:700;letter-spacing:-.025em;
  padding-bottom:18px;border-bottom:1px solid var(--line);margin-bottom:28px;
}
.doc-view .doc-meta{font-size:13px;color:var(--ink-3);margin-top:-16px;margin-bottom:24px}

/* Markdown render */
.md{font-size:16px;line-height:1.8;color:var(--ink-2)}
.md h1{font-size:30px;font-weight:700;letter-spacing:-.02em;color:var(--ink);margin:36px 0 14px}
.md h2{font-size:23px;font-weight:700;letter-spacing:-.015em;color:var(--ink);margin:32px 0 12px}
.md h3{font-size:18px;font-weight:700;color:var(--ink);margin:26px 0 10px}
.md p{margin:14px 0}
.md ul,.md ol{margin:14px 0 14px 24px}
.md li{margin:7px 0}
.md strong{color:var(--ink)}
.md a{color:var(--accent);border-bottom:1px solid rgba(0,113,227,.3)}
.md blockquote{
  border-left:3px solid var(--accent);padding:6px 0 6px 18px;margin:20px 0;
  color:var(--ink);font-weight:500;background:rgba(0,113,227,.04);
  border-radius:0 12px 12px 0;
}
.md code{
  font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:.88em;
  background:rgba(0,0,0,.06);padding:2px 7px;border-radius:6px;
}
.md pre{
  background:#1d1d1f;color:#f5f5f7;padding:20px 22px;border-radius:14px;
  overflow-x:auto;margin:22px 0;font-size:13.5px;line-height:1.65;
}
.md pre code{background:none;padding:0;color:inherit;font-size:inherit}
.md table{width:100%;border-collapse:collapse;margin:22px 0;font-size:14.5px}
.md th,.md td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line)}
.md th{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:700}
.md hr{border:none;border-top:1px solid var(--line);margin:30px 0}
.md img{border-radius:12px}

.doc-nav{display:flex;justify-content:space-between;gap:16px;margin-top:56px;padding-top:26px;border-top:1px solid var(--line)}
.doc-nav a{font-size:15px;font-weight:600;color:var(--accent)}
.doc-nav a:hover{text-decoration:underline}
.doc-nav .placeholder{color:transparent;user-select:none}
</style>
</head>
<body data-page="docs">

<div class="wrap">
  <header class="docs-head">
    <p class="eyebrow reveal">/docs</p>
    <h1 class="reveal">Açık kaynak dökümanları</h1>
    <p class="lede reveal" data-delay="120">
      Herkese açık proje notlarım. Soldan bir proje ve bölüm seç; mimari kararlar,
      tasarım notları ve uygulama detayları doğrudan Markdown kaynaklarından render edilir.
    </p>
    <div class="proj-switch reveal" id="projSwitch" data-delay="200"></div>
  </header>

  <div class="docs-layout">
    <aside class="docs-side" id="docsSide"></aside>
    <main class="doc-view" id="docView"></main>
  </div>
</div>

<footer>
  <p>Alperen Erkan — Ankara, Türkiye</p>
  <p><a href="index.html">Ana Sayfa</a> · <a href="about.html">Hakkımda</a> · <a href="git.html">GitHub</a></p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="shared.js"></script>
<script src="docs.js"></script>
<script>
(function(){
  var data = window.DOCS_DATA;
  var switcher = document.getElementById('projSwitch');
  var side = document.getElementById('docsSide');
  var view = document.getElementById('docView');

  marked.setOptions({ gfm:true, breaks:false });

  function parseHash(){
    var h = decodeURIComponent(location.hash.replace(/^#\/?/,''));
    var parts = h.split('/');
    var proj = data.projects.find(function(p){return p.id===parts[0]}) || data.projects[0];
    var doc = proj.docs.find(function(d){return d.id===parts[1]}) || proj.docs[0];
    return { proj: proj, doc: doc };
  }

  function render(){
    var cur = parseHash();
    var proj = cur.proj, doc = cur.doc;

    // Proje sekmeleri
    switcher.innerHTML = data.projects.map(function(p){
      return '<button class="proj-tab'+(p.id===proj.id?' active':'')+'" data-proj="'+p.id+'">'+
        '<div class="t-name">'+p.name+'</div><div class="t-tag">'+p.tag+'</div></button>';
    }).join('');
    switcher.querySelectorAll('.proj-tab').forEach(function(btn){
      btn.addEventListener('click', function(){
        var p = data.projects.find(function(x){return x.id===btn.dataset.proj});
        location.hash = '#/'+p.id+'/'+p.docs[0].id;
      });
    });

    // Sol menü
    side.innerHTML =
      '<div class="s-title">'+proj.name+' — Bölümler</div>'+
      '<p class="s-desc">'+proj.desc+'</p>'+
      proj.docs.map(function(d,i){
        return '<a class="doc-link'+(d.id===doc.id?' active':'')+'" href="#/'+proj.id+'/'+d.id+'">'+
          '<span class="n">'+String(i+1).padStart(2,'0')+'</span>'+d.title+'</a>';
      }).join('');

    // İçerik
    var idx = proj.docs.indexOf(doc);
    var prev = proj.docs[idx-1], next = proj.docs[idx+1];
    view.innerHTML =
      '<h2 class="doc-title">'+doc.title+'</h2>'+
      '<div class="doc-meta">'+proj.name+' · Bölüm '+(idx+1)+'/'+proj.docs.length+'</div>'+
      '<article class="md">'+marked.parse(doc.md)+'</article>'+
      '<nav class="doc-nav">'+
        (prev ? '<a href="#/'+proj.id+'/'+prev.id+'">← '+prev.title+'</a>' : '<span class="placeholder">.</span>')+
        (next ? '<a href="#/'+proj.id+'/'+next.id+'">'+next.title+' →</a>' : '<span class="placeholder">.</span>')+
      '</nav>';
    document.title = doc.title + ' — ' + proj.name + ' | Alperen Erkan';
    window.scrollTo({top:0, behavior:'instant' in window ? 'instant' : 'auto'});
  }

  window.addEventListener('hashchange', render);
  render();
})();
</script>
</body>
</html>
